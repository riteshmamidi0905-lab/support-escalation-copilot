name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint-and-unit:
    name: lint + tests without a database (py3.11, py3.12)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python scripts/sync_threat_model.py && git diff --exit-code docs/threat-model.md
      - name: Dataset determinism across platforms (regenerates and compares with the committed files)
        run: |
          python -m copilot.data.cli generate --seed 20260101 --out /tmp/regen
          diff -r /tmp/regen data/meridian-seed-20260101
          python -m copilot.data.cli verify data/meridian-seed-20260101
      - run: pytest -q
  database:
    name: PostgreSQL 16 + pgvector (RLS, FTS, vector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: copilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_admin -d copilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      COPILOT_TEST_DATABASE_URL: postgresql://ci_admin:ci-only-throwaway@localhost:5432/copilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Database tests must RUN, not skip
        run: |
          pytest tests/db -q -rs | tee db.log
          ! grep -E "skipped" db.log
      - name: Whole suite against the database
        run: pytest -q
  compose:
    name: docker compose database comes up healthy
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-throwaway
      POSTGRES_PORT: "5433"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: docker compose up -d --wait
      - run: pip install -e ".[dev]"
      - name: Clean rebuild against the compose database (migrate, bootstrap, generate, validate, load, tenant sweep)
        env:
          COPILOT_ADMIN_DSN: postgresql://copilot_admin:ci-only-throwaway@127.0.0.1:5433/copilot
          COPILOT_APP_PASSWORD: ci-app-throwaway-1
          COPILOT_LOADER_PASSWORD: ci-loader-throwaway-1
          COPILOT_INTAKE_PASSWORD: ci-intake-throwaway-1
          COPILOT_SCOPE_SECRET: ci-only-scope-secret-0123456789abcdef0123456789
        run: python -m copilot.db.rebuild --dbname copilot_ci_rebuild
      - name: DB tests against the compose database
        env:
          COPILOT_TEST_DATABASE_URL: postgresql://copilot_admin:ci-only-throwaway@127.0.0.1:5433/copilot
        run: pytest tests/db -q -rs
      - if: always()
        run: docker compose down -v
