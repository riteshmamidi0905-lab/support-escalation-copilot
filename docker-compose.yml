# Development database only (M0). The application services arrive in later milestones.
# Image: PostgreSQL 16 with pgvector. Credentials are throw-away development values from the environment, never real secrets.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"     # bound to localhost only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copilot_admin} -d ${POSTGRES_DB:-copilot}"]
      interval: 3s
      timeout: 3s
      retries: 20
